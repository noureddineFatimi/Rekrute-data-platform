services:
  postgres:
    image: postgres:14.24-alpine3.23
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    secrets:
      - db_password
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: adminer_ui
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  api:
    image: offers-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: offers_api
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  airflow-migrate:
    image: airflow-workflows-manager:latest
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow_migrate
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    depends_on:
      postgres:
        condition: service_healthy
    command: ["db", "migrate"]
    networks:
      - app-network

  airflow-api:
    image: airflow-workflows-manager:latest
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow_api
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    command: ["api-server"]
    networks:
      - app-network

  airflow-scheduler:
    image: airflow-workflows-manager:latest
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow_scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully
    command: ["scheduler"]
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge

secrets:
  db_password:
    file: ./db_password.txt